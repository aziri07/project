<title>رَصد للسوشيال ميديا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: fixed side rail (right, RTL) + scrolling workspace; collapses to a top tab strip on phones */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#E8ECEF; --line:#D9DFE4;
  --fg:#16202A; --muted:#5E6B77; --accent:#0B7A75; --accent-soft:#D5EEEC; --accent-fg:#FFFFFF;
  --amber:#B7791F; --good:#15803D; --bad:#C2410C; --draft:#6B7280;
  --font-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --font-head:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F161C; --surface:#172129; --sunk:#1F2B34; --line:#2A3843;
  --fg:#E6ECF0; --muted:#94A3AF; --accent:#3CC1B8; --accent-soft:#163A39; --accent-fg:#06201F;
  --amber:#E0A84A; --good:#4ADE80; --bad:#FB923C; --draft:#9CA3AF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#172129; --sunk:#1F2B34; --line:#2A3843;
  --fg:#E6ECF0; --muted:#94A3AF; --accent:#3CC1B8; --accent-soft:#163A39; --accent-fg:#06201F;
  --amber:#E0A84A; --good:#4ADE80; --bad:#FB923C; --draft:#9CA3AF; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.rail{background:var(--surface);border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.railtop{display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:700;font-size:20px}
.logo svg{flex:none}
.brandpick label{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:110px}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
nav.menu a:hover{background:var(--sunk)}
nav.menu a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.menu svg{width:18px;height:18px;flex:none}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted)}
main{min-width:0;padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px}
.sub{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--font-head);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--good)} .down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.grid2 > *{min-width:0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.netchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.netchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.published{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.scheduled{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.pill.draft{background:color-mix(in srgb,var(--draft) 18%,transparent);color:var(--draft)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--muted);font-weight:500;text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.ptext{max-width:340px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.item:hover{border-color:var(--accent)}
.item .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .body{min-width:0;flex:1}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-inline-start:1px solid var(--line)}
.cal .dow{font-size:12px;color:var(--muted);padding:6px;text-align:center;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
.cal .day{min-height:108px;padding:6px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.cal .day:hover{background:var(--sunk)}
.cal .day.out{opacity:.45}
.cal .day .n{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cal .day.today .n{background:var(--accent);color:var(--accent-fg);border-radius:999px;width:22px;height:22px;display:grid;place-items:center}
.cal .ev{font-size:11px;padding:3px 6px;border-radius:5px;background:var(--sunk);border-inline-start:3px solid var(--draft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.published{border-color:var(--good)} .cal .ev.scheduled{border-color:var(--amber)}
.cal .more{font-size:11px;color:var(--muted)}
/* heatmap */
.heat{display:grid;grid-template-columns:52px repeat(24,minmax(14px,1fr));gap:2px;min-width:480px;font-size:10px;color:var(--muted)}
.heat .c{aspect-ratio:1;border-radius:3px;background:var(--accent)}
.heat .hl{text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{width:auto;min-width:140px}
/* brands */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.acc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.acc:last-child{border-bottom:0}
.swatch{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:-2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row > *{flex:1;min-width:120px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted)}
/* modal */
.scrim{position:fixed;inset:0;background:rgb(10 16 20 / .45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--line);width:min(560px,100%);max-height:92vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:18px}
.netpick{display:flex;flex-wrap:wrap;gap:6px}
.netpick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:13px}
.netpick input{width:auto;margin:0}
.counter{font-size:12px;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-size:13px}
.note{font-size:12px;color:var(--muted);background:var(--sunk);padding:8px 12px;border-radius:8px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));z-index:20;border-inline-end:0;border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .rail .foot{display:none}
  .railtop{flex-direction:row;gap:10px;align-items:center}
  .railtop .brandpick{flex:1}
  .brandpick label{display:none}
  nav.menu{flex-direction:row;overflow-x:auto}
  nav.menu a{white-space:nowrap;padding:7px 10px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .cal .day{min-height:64px;padding:3px}
  .cal .ev{font-size:0;padding:0;height:6px;border-inline-start:0;background:var(--draft)}
  .cal .ev.published{background:var(--good)} .cal .ev.scheduled{background:var(--amber)}
}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}
</style>

<div class="app" dir="rtl" lang="ar">
  <aside class="rail">
    <div class="railtop">
      <div class="logo">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="var(--accent)"/><path d="M7 20 L12 14 L16 17 L23 9" stroke="var(--accent-fg)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="9" r="2.2" fill="var(--accent-fg)"/></svg>
        رَصد
      </div>
      <div class="brandpick">
        <label for="brandSel">العلامة التجارية</label>
        <select id="brandSel"></select>
      </div>
    </div>
    <nav class="menu" id="menu">
      <a href="#dashboard" data-v="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>لوحة التحكم</a>
      <a href="#planner" data-v="planner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>التقويم والجدولة</a>
      <a href="#posts" data-v="posts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>المنشورات</a>
      <a href="#analytics" data-v="analytics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التحليلات</a>
      <a href="#brands" data-v="brands"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>العلامات والحسابات</a>
    </nav>
    <div class="foot" id="syncState">جارٍ الاتصال بقاعدة البيانات…</div>
  </aside>
  <main id="view"></main>
</div>
<div id="modalRoot"></div>

<script>
const NETS = {
  instagram:{label:'إنستغرام',color:'#D6336C'},
  facebook:{label:'فيسبوك',color:'#3B6FE0'},
  x:{label:'إكس',color:'#7C8794'},
  tiktok:{label:'تيك توك',color:'#14A6A0'},
  linkedin:{label:'لينكدإن',color:'#2E7FC4'},
  youtube:{label:'يوتيوب',color:'#E0443A'}
};
const STATUS = {published:'منشور',scheduled:'مجدول',draft:'مسودة'};
const DOW = ['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const nf = new Intl.NumberFormat('ar-u-nu-latn');
const nfc = new Intl.NumberFormat('ar-u-nu-latn',{notation:'compact',maximumFractionDigits:1});
const df = new Intl.DateTimeFormat('ar-u-nu-latn',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const dfDay = new Intl.DateTimeFormat('ar-u-nu-latn',{day:'numeric',month:'short'});
const dfMonth = new Intl.DateTimeFormat('ar-u-nu-latn',{month:'long',year:'numeric'});

const S = {brands:[], posts:[], series:{}, brandId:null, view:'dashboard', calMonth:null, anaNet:'all', filt:{status:'all',net:'all',q:''}, db:null, loaded:{brands:false,posts:false,series:false}, readOnly:false};
try{ S.brandId = localStorage.getItem('rasd.brand'); }catch(e){}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }

const brand = () => S.brands.find(b => b.id === S.brandId) || S.brands[0] || null;
const brandPosts = () => { const b = brand(); return b ? S.posts.filter(p => p.brandId === b.id) : []; };
const netChip = n => NETS[n] ? `<span class="netchip"><i style="background:${NETS[n].color}"></i>${NETS[n].label}</span>` : '';
const pill = s => `<span class="pill ${s}">${STATUS[s]||s}</span>`;
function postTotals(p, net){
  const m = p.metrics || {}; const t = {impressions:0,likes:0,comments:0,shares:0,clicks:0};
  for (const k of Object.keys(m)) { if (net && net!=='all' && k!==net) continue; for (const f in t) t[f] += +(m[k][f]||0); }
  t.eng = t.likes + t.comments + t.shares; return t;
}

/* ---------- charts (hand-drawn SVG, one scale per chart) ---------- */
function nice(max){ if(max<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(max))); const m=max/p; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p; }
function lineChart(series, labels){
  const W=640,H=230,L=52,R=14,T=12,B=28; const n=labels.length;
  if(!n||!series.length) return '<div class="empty">لا توجد بيانات كافية لرسم المخطط.</div>';
  const all = series.flatMap(s=>s.values); let lo=Math.min(...all), hi=Math.max(...all);
  const span = nice((hi-lo)||hi||1); const step = span/4; lo = Math.floor(lo/step)*step; hi = lo + step*4; if(hi < Math.max(...all)) hi += step;
  const x = i => W-R - (i/(n-1||1))*(W-L-R); // RTL: oldest on the right
  const y = v => T + (1-(v-lo)/(hi-lo||1))*(H-T-B);
  let g='';
  for(let v=lo; v<=hi+1e-9; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${nfc.format(v)}</text>`; }
  [0, Math.floor((n-1)/2), n-1].forEach(i=>{ g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${dfDay.format(new Date(labels[i]))}</text>`; });
  series.forEach((s,si)=>{
    const pts = s.values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if(series.length===1) g+=`<polygon points="${x(0)},${y(lo)} ${pts} ${x(n-1)},${y(lo)}" fill="${s.color}" opacity=".12"/>`;
    g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`;
    g+=`<circle cx="${x(n-1)}" cy="${y(s.values[n-1])}" r="3.6" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function barChart(items){ // [{label,color,value,fmt}]
  if(!items.length) return '<div class="empty">لا توجد بيانات.</div>';
  const max = nice(Math.max(...items.map(i=>i.value),1));
  return `<div class="list">${items.map(i=>`<div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${i.label}</span><span style="font-variant-numeric:tabular-nums;color:var(--muted)">${i.fmt||nf.format(i.value)}</span></div><div style="background:var(--sunk);border-radius:4px;height:9px"><div style="width:${(i.value/max*100).toFixed(1)}%;background:${i.color};height:9px;border-radius:4px"></div></div></div>`).join('')}</div>`;
}

/* ---------- views ---------- */
function shell(title, sub, actions=''){ return `<div class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">${actions}</div></div>`; }
const newBtn = (label='منشور جديد') => `<button class="btn primary" data-act="new" ${S.readOnly?'disabled':''}>+ ${label}</button>`;

function emptyAll(){
  const ready = S.loaded.brands;
  return shell('مرحبًا بك في رَصد', ready ? 'لا توجد علامات تجارية بعد.' : 'جارٍ تحميل البيانات…') +
   `<div class="panel empty">${ready ? 'ابدأ بإضافة علامة تجارية وربط حساباتها من صفحة <a href="#brands">العلامات والحسابات</a>، ثم جدول منشوراتك وتابع أداءها هنا.' : 'جارٍ جلب العلامات التجارية والمنشورات من قاعدة البيانات…'}</div>`;
}

function vDashboard(){
  const b = brand(); if(!b) return emptyAll();
  const ser = S.series[b.id]; const posts = brandPosts();
  const nets = Object.keys(b.networks||{});
  const now = new Date(); const d30 = new Date(now - 30*864e5);
  const pub = posts.filter(p=>p.status==='published' && new Date(p.scheduledAt)>=d30);
  const tot = pub.reduce((a,p)=>{const t=postTotals(p); for(const k in t)a[k]=(a[k]||0)+t[k]; return a;},{});
  const followersNow = nets.reduce((a,n)=>a+(+b.networks[n].followers||0),0);
  let growth=null, followSeries=[];
  if(ser && ser.days && ser.followers){
    const sum = ser.days.map((_,i)=>nets.reduce((a,n)=>a+((ser.followers[n]||[])[i]||0),0));
    if(sum[0]) growth = (sum[sum.length-1]-sum[0])/sum[0]*100;
    followSeries = nets.filter(n=>ser.followers[n]).map(n=>({name:n,color:NETS[n].color,values:ser.followers[n]}));
  }

  </div>`;
}
const itemRow = p => `<div class="item" data-edit="${p.id}"><div class="body"><div class="ptext">${esc(p.text)}</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">${(p.networks||[]).map(netChip).join('')}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="when">${p.scheduledAt?df.format(new Date(p.scheduledAt)):'بلا موعد'}</span>${pill(p.status)}</div></div>`;

function vPlanner(){
  const b = brand(); if(!b) return emptyAll();
  const now = new Date(); const m = S.calMonth || new Date(now.getFullYear(), now.getMonth(), 1); S.calMonth = m;
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const offset = (first.getDay()+1)%7; // Saturday first
  const start = new Date(first); start.setDate(1-offset);
  const byDay = {}; brandPosts().forEach(p=>{ if(!p.scheduledAt) return; const k=p.scheduledAt.slice(0,10); (byDay[k]=byDay[k]||[]).push(p); });
  Object.values(byDay).forEach(a=>a.sort((x,y)=>x.scheduledAt.localeCompare(y.scheduledAt)));
  let cells = DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  const weeks = Math.ceil((offset + new Date(m.getFullYear(), m.getMonth()+1, 0).getDate())/7);
  for(let i=0;i<weeks*7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i); const k=dayKey(d);
    const ps = byDay[k]||[];
    cells += `<div class="day ${d.getMonth()!==m.getMonth()?'out':''} ${k===dayKey(now)?'today':''}" data-day="${k}"><span class="n">${d.getDate()}</span>${ps.slice(0,3).map(p=>`<div class="ev ${p.status}" data-edit="${p.id}" title="${esc(p.text)}">${p.scheduledAt.slice(11,16)} ${esc(p.text)}</div>`).join('')}${ps.length>3?`<span class="more">+${ps.length-3} أخرى</span>`:''}</div>`;
  }
  const drafts = brandPosts().filter(p=>p.status==='draft');
  return shell('التقويم والجدولة','اضغط على أي يوم لجدولة منشور فيه، أو على منشور لتعديله', newBtn()) + `
  <section class="panel">
    <h2><span class="calhead"><button class="btn" data-cal="-1" aria-label="الشهر السابق">→</button><span>${dfMonth.format(m)}</span><button class="btn" data-cal="1" aria-label="الشهر التالي">←</button><button class="btn" data-cal="0">اليوم</button></span>
    <span class="legend" style="margin:0"><span><i style="background:var(--good)"></i>منشور</span><span><i style="background:var(--amber)"></i>مجدول</span><span><i style="background:var(--draft)"></i>مسودة</span></span></h2>
    <div class="tbl-wrap"><div class="cal">${cells}</div></div>
  </section>
  <section class="panel"><h2>المسودات (${nf.format(drafts.length)})</h2>${drafts.length?`<div class="list">${drafts.map(itemRow).join('')}</div>`:'<div class="empty">لا توجد مسودات.</div>'}</section>`;
}

function vAnalytics(){
  const b = brand(); if(!b) return emptyAll();
  const nets = Object.keys(b.networks||{}); const net = nets.includes(S.anaNet)?S.anaNet:'all';
  const ser = S.series[b.id];
  const pub = brandPosts().filter(p=>p.status==='published' && (net==='all'||(p.networks||[]).includes(net)));
  const tot = pub.reduce((a,p)=>{const t=postTotals(p,net); for(const k in t)a[k]=(a[k]||0)+t[k]; return a;},{impressions:0,likes:0,comments:0,shares:0,clicks:0,eng:0});
  const showNets = net==='all'?nets:[net];
  const fs = ser?.followers ? showNets.filter(n=>ser.followers[n]).map(n=>({name:n,color:NETS[n].color,values:ser.followers[n]})) : [];
  const followers = showNets.reduce((a,n)=>a+(+b.networks[n].followers||0),0);
  // daily published posts + engagement by day of week
  const dowEng = Array(7).fill(0), dowCnt = Array(7).fill(0);
  pub.forEach(p=>{ const i=(new Date(p.scheduledAt).getDay()+1)%7; dowEng[i]+=postTotals(p,net).eng; dowCnt[i]++; });
  const heat = ser?.heat; let heatHtml='<div class="empty">لا تتوفر بيانات نشاط الجمهور بعد.</div>';
  if(heat && heat.length===7){
    const mx = Math.max(...heat.flat(),1);
    heatHtml = `<div class="tbl-wrap"><div class="heat"><span></span>${Array.from({length:24},(_,h)=>`<span class="hl">${h%3===0?h:''}</span>`).join('')}${heat.map((row,d)=>`<span>${DOW[d]}</span>${row.map((v,h)=>`<span class="c" style="opacity:${(0.08+0.92*v/mx).toFixed(2)}" title="${DOW[d]} ${pad(h)}:00 — نشاط ${v}"></span>`).join('')}`).join('')}</div></div>`;
    let best=[]; heat.forEach((r,d)=>r.forEach((v,h)=>best.push({d,h,v}))); best.sort((a,c)=>c.v-a.v);
    heatHtml += `<div class="note" style="margin-top:10px">أفضل أوقات النشر: ${best.slice(0,3).map(x=>`${DOW[x.d]} ${pad(x.h)}:00`).join('، ')}</div>`;
  }
  return shell('التحليلات', 'أداء الحسابات والمنشورات المنشورة', '') + `
  <div class="tabs"><button class="tab" data-net="all" aria-pressed="${net==='all'}">كل الشبكات</button>${nets.map(n=>`<button class="tab" data-net="${n}" aria-pressed="${net===n}"><i style="width:8px;height:8px;border-radius:50%;background:${NETS[n].color};display:inline-block"></i>${NETS[n].label}</button>`).join('')}</div>
  <div class="kpis">
    <div class="kpi"><span class="l">المتابعون</span><span class="v">${nfc.format(followers)}</span></div>
    <div class="kpi"><span class="l">المنشورات المنشورة</span><span class="v">${nf.format(pub.length)}</span></div>
    <div class="kpi"><span class="l">متوسط الظهور لكل منشور</span><span class="v">${nfc.format(pub.length?tot.impressions/pub.length:0)}</span></div>
    <div class="kpi"><span class="l">إعجابات / تعليقات / مشاركات</span><span class="v" style="font-size:19px">${nfc.format(tot.likes)} / ${nfc.format(tot.comments)} / ${nfc.format(tot.shares)}</span></div>
    <div class="kpi"><span class="l">معدل التفاعل</span><span class="v">${tot.impressions?(tot.eng/tot.impressions*100).toFixed(2):'0.00'}%</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><h2>المتابعون خلال 30 يومًا</h2>${lineChart(fs, ser?.days||[])}<div class="legend">${fs.map(s=>`<span><i style="background:${s.color}"></i>${NETS[s.name].label}</span>`).join('')}</div></section>
    <section class="panel"><h2>متوسط التفاعل حسب يوم النشر</h2>${barChart(DOW.map((d,i)=>({label:d,color:'var(--accent)',value:dowCnt[i]?Math.round(dowEng[i]/dowCnt[i]):0})))}</section>
  </div>
  <section class="panel"><h2>أفضل وقت للنشر (نشاط الجمهور بالساعة)</h2>${heatHtml}</section>`;
}

/* ---------- composer modal ---------- */
function openComposer(post, dateStr){
  const b = brand(); if(!b){ toast('أضف علامة تجارية أولًا'); return; }
  const nets = Object.keys(b.networks||{});
  const p = post || {id:null, text:'', networks:nets.slice(0,2), status:'scheduled', scheduledAt: dateStr || isoLocal(new Date(Date.now()+864e5)).slice(0,11)+'10:00'};
  const ro = S.readOnly?'disabled':'';
  $('#modalRoot').innerHTML = `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" dir="rtl">
    <h2 id="mt">${post?'تعديل منشور':'منشور جديد'} · ${esc(b.name)}</h2>
    <div class="field"><label for="cText">النص</label><textarea id="cText" maxlength="2200" placeholder="اكتب منشورك…">${esc(p.text)}</textarea><div class="counter" id="cCount"></div></div>
    <div class="field"><label>الشبكات</label><div class="netpick">${nets.length?nets.map(n=>`<label><input type="checkbox" value="${n}" ${(p.networks||[]).includes(n)?'checked':''}><i style="width:8px;height:8px;border-radius:50%;background:${NETS[n].color};display:inline-block"></i>${NETS[n].label}</label>`).join(''):'<span class="sub">اربط حسابًا أولًا من صفحة العلامات.</span>'}</div></div>
    <div class="row"><div class="field"><label for="cWhen">موعد النشر</label><input id="cWhen" type="datetime-local" value="${esc(p.scheduledAt||'')}"></div>
    <div class="field"><label for="cStatus">الحالة</label><select id="cStatus">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${p.status===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
    ${post&&post.status==='published'?(()=>{const t=postTotals(post);return `<div class="note">الأداء: ${nfc.format(t.impressions)} ظهور · ${nf.format(t.likes)} إعجاب · ${nf.format(t.comments)} تعليق · ${nf.format(t.shares)} مشاركة · ${nf.format(t.clicks)} نقرة</div>`})():''}
    <div class="actions"><div style="display:flex;gap:8px">${post?`<button class="btn danger" id="cDel" ${ro}>حذف</button>`:''}</div>
      <div style="display:flex;gap:8px"><button class="btn" id="cCancel">إلغاء</button><button class="btn primary" id="cSave" ${ro}>${post?'حفظ التغييرات':'حفظ'}</button></div></div>
  </div></div>`;
  const txt=$('#cText'), cnt=$('#cCount'); const upd=()=>cnt.textContent=`${nf.format(txt.value.length)} / 2,200${txt.value.length>280?' · يتجاوز حد إكس (280)':''}`; upd(); txt.addEventListener('input',upd); txt.focus();
  const close=()=>{$('#modalRoot').innerHTML=''; document.removeEventListener('keydown',onKey);}; const onKey=e=>{if(e.key==='Escape')close();}; document.addEventListener('keydown',onKey);
  $('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')close();}); $('#cCancel').onclick=close;
  $('#cSave').onclick=async()=>{
    const text=txt.value.trim(); const networks=[...document.querySelectorAll('.netpick input:checked')].map(i=>i.value);
    const status=$('#cStatus').value; const scheduledAt=$('#cWhen').value;
    if(!text){ toast('اكتب نص المنشور'); return; }
    if(!networks.length){ toast('اختر شبكة واحدة على الأقل'); return; }
    if(status!=='draft' && !scheduledAt){ toast('حدّد موعد النشر'); return; }
    const id = p.id || uid();
    const doc = {brandId:b.id, text, networks, status, scheduledAt: scheduledAt||'', metrics: post?.metrics||{}, updatedAt:new Date().toISOString(), createdAt: post?.createdAt||new Date().toISOString()};
    $('#cSave').disabled=true;
    try{ await S.db.collection('posts').doc(id).set(doc); close(); toast(post?'تم حفظ التغييرات':(status==='scheduled'?'تمت الجدولة':'تم الحفظ')); }
    catch(e){ $('#cSave').disabled=false; writeFail(e); }
  };
  if(post) $('#cDel').onclick=async(e)=>{
    const btn=e.currentTarget; if(btn.dataset.sure!=='1'){ btn.dataset.sure='1'; btn.textContent='تأكيد الحذف'; return; }
    try{ await S.db.collection('posts').doc(post.id).delete(); close(); toast('تم حذف المنشور'); }catch(err){ writeFail(err); }
  };
}
function writeFail(e){
  if(e && e.code==='invalid_argument'){ S.readOnly=true; render(); toast('لديك صلاحية القراءة فقط على هذه الصفحة'); }
  else if(e && e.code==='quota_exceeded') toast('امتلأت قاعدة البيانات، احذف بعض المنشورات القديمة');
  else toast('تعذّر الحفظ، حاول مرة أخرى');
}

/* ---------- render + events ---------- */
const VIEWS = {dashboard:vDashboard, planner:vPlanner, posts:vPosts, analytics:vAnalytics, brands:vBrands};
function render(){
  const sel=$('#brandSel'); const b=brand();
  sel.innerHTML = S.brands.length ? S.brands.map(x=>`<option value="${x.id}" ${b&&x.id===b.id?'selected':''}>${esc(x.name)}</option>`).join('') : '<option>—</option>';
  document.querySelectorAll('#menu a').forEach(a=>{ if(a.dataset.v===S.view) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  const active=document.activeElement?.id; const pos=active==='fq'?document.activeElement.selectionStart:null;
  $('#view').innerHTML = (VIEWS[S.view]||vDashboard)();
  if(active==='fq'){ const i=$('#fq'); if(i){ i.focus(); i.setSelectionRange(pos,pos);} }
}
function route(){ const h=location.hash.slice(1); S.view = VIEWS[h]?h:'dashboard'; render(); }
window.addEventListener('hashchange',route);
$('#brandSel').addEventListener('change',e=>{ S.brandId=e.target.value; try{localStorage.setItem('rasd.brand',S.brandId)}catch(_){} render(); });
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-edit],[data-act],[data-day],[data-cal],[data-net],[data-unlink],[data-delbrand]'); if(!t) return;
  if(t.dataset.edit){ e.stopPropagation(); const p=S.posts.find(x=>x.id===t.dataset.edit); if(p) openComposer(p); return; }
  if(t.dataset.act==='new') return openComposer(null);
  if(t.dataset.day){ if(!S.readOnly) openComposer(null, t.dataset.day+'T10:00'); return; }
  if(t.dataset.cal!=null){ const v=+t.dataset.cal; const m=S.calMonth; S.calMonth = v===0?null:new Date(m.getFullYear(), m.getMonth()+v, 1); render(); return; }
  if(t.dataset.net){ S.anaNet=t.dataset.net; render(); return; }
  if(t.dataset.unlink){ const [bid,n]=t.dataset.unlink.split('|'); const b=S.brands.find(x=>x.id===bid); const nets={...b.networks}; delete nets[n];
    const {id:_omit, ...body} = b;
    try{ await S.db.collection('brands').doc(bid).set({...body, networks:nets}); toast('تم فصل الحساب'); }catch(err){ writeFail(err); } return; }
  if(t.dataset.delbrand){ if(t.dataset.sure!=='1'){ t.dataset.sure='1'; t.textContent='تأكيد: حذف العلامة ومنشوراتها'; return; }
    const bid=t.dataset.delbrand;
    try{ for(const p of S.posts.filter(p=>p.brandId===bid)) await S.db.collection('posts').doc(p.id).delete(); await S.db.collection('brands').doc(bid).delete(); toast('تم حذف العلامة'); }catch(err){ writeFail(err); } }
});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){ S.filt.q=e.target.value; render(); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='fs'){ S.filt.status=e.target.value; render(); }
  if(e.target.id==='fn'){ S.filt.net=e.target.value; render(); }
});
document.addEventListener('submit',async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='brandForm'){ const name=$('#bName').value.trim(); if(!name) return; const id='b'+Date.now().toString(36);
    try{ await S.db.collection('brands').doc(id).set({name,color:$('#bColor').value,networks:{},createdAt:new Date().toISOString()}); S.brandId=id; toast('تمت إضافة العلامة'); }catch(err){ writeFail(err); } return; }
  if(f.dataset.link){ const b=S.brands.find(x=>x.id===f.dataset.link); const fd=new FormData(f); const n=fd.get('net'); let h=String(fd.get('handle')).trim(); if(!h) return; if(!h.startsWith('@')) h='@'+h;
    try{ await S.db.collection('brands').doc(b.id).update({networks:{[n]:{handle:h,followers:+fd.get('followers')||0}}}); toast(`تم ربط ${NETS[n].label}`); }catch(err){ writeFail(err); } }
});

/* ---------- database ---------- */
(async()=>{
  route();
  const db = await window.claude?.use?.('db').catch(()=>null);
  if(!db){ $('#syncState').textContent='قاعدة البيانات غير متاحة في هذا العرض.'; S.loaded.brands=true; S.readOnly=true; render(); return; }
  S.db = db;
  try{ const user = await window.claude.use('user'); const w = user ? await user.can('data.write') : null; if(w===false) S.readOnly=true; }catch(_){}
  const timer = setTimeout(()=>{ $('#syncState').textContent='تعذّر الوصول إلى قاعدة البيانات حتى الآن…'; },10000);
  const done = () => { if(S.loaded.brands&&S.loaded.posts){ clearTimeout(timer); $('#syncState').innerHTML=`متصل · ${nf.format(S.posts.length)} منشورًا محفوظًا${S.readOnly?' · قراءة فقط':''}`; } };
  const fail = e => { clearTimeout(timer); $('#syncState').textContent='انقطع الاتصال بقاعدة البيانات. أعد فتح الصفحة.'; };
  db.collection('brands').onSnapshot(s=>{ S.brands=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||'')); if(!s.metadata.fromCache) S.loaded.brands=true; done(); if(!document.querySelector('.scrim')) render(); }, fail);
  db.collection('posts').onSnapshot(s=>{ S.posts=s.docs.map(d=>({id:d.id,...d.data()})); if(!s.metadata.fromCache) S.loaded.posts=true; done(); if(!document.querySelector('.scrim')) render(); }, fail);
  db.collection('series').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.series=o; if(!document.querySelector('.scrim')) render(); }, fail);
})();
</script>
